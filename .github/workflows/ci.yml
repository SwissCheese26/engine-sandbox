name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-bun downloads Bun from GitHub; on a 504 from there it is tried once more after a pause
      - uses: oven-sh/setup-bun@v2
        id: bun1
        continue-on-error: true
      - if: steps.bun1.outcome == 'failure'
        run: sleep 30
      - if: steps.bun1.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build

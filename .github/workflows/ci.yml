name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-bun downloads Bun from GitHub releases; when that fails (504 during GitHub outages) Bun comes from
      # the npm registry instead (same release, platform binary package)
      - uses: oven-sh/setup-bun@v2
        id: bun1
        continue-on-error: true
        with:
          bun-version: 1.4.4 # keep in step with the npm fallback below
      - if: steps.bun1.outcome == 'failure'
        run: npm install -g bun@1.4.4 && bun --version
      - run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
